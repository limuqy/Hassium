plugins {
    id 'loom-fabric'
}

// 26.x：cloth-config 暂无对应构建，cloth-ui（硬 import cloth API）暂不编入；
// HassiumModMenuIntegration 的 cloth 分支已降级返回 null。cloth 26.x 构建就绪后恢复此 srcDir。
// sourceSets {
//     main {
//         java {
//             srcDir rootProject.file('cloth-ui/src/main/java')
//         }
//     }
// }


dependencies {
    // fabric-api 的 maven 坐标 group 是 net.fabricmc.fabric-api（双层），写成 net.fabricmc 会 404
    implementation "net.fabricmc.fabric-api:fabric-api:${gradle.ext.fabric_api_version}"
    // zstd-jni 零编译期依赖：由 native-dep-shade.gradle 嵌入 + ZstdRuntimeBridge 隔离加载（勿在此声明）
    implementation 'org.lz4:lz4-java:1.8.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.1'

    // Night Config：编译 + jiJ（Fabric 自管 toml；common 源码合并进本模块编译）
    compileOnly "com.electronwill.night-config:core:3.6.7"
    compileOnly "com.electronwill.night-config:toml:3.6.7"
    include "com.electronwill.night-config:core:3.6.7"
    include "com.electronwill.night-config:toml:3.6.7"


    // Mod Menu：仅编译期；玩家可选安装。26.x 暂用 1.21.11 代 API 编译（ModMenuApi#getModConfigScreenFactory
    // 接口稳定）；26.3 专用 modmenu 构建发布后切换坐标。
    // 源用 Modrinth Maven（CDN，快且稳）：坐标 maven.modrinth:modmenu:<ver>。
    if (gradle.ext.has('modmenu_version')) {
        compileOnly "maven.modrinth:modmenu:${gradle.ext.modmenu_version}"
    }

    // Cloth Config：编译期需要（HassiumClothConfigScreen）；可选依赖，不 jiJ
    // if (gradle.ext.has('cloth_config_version')) {
    //     modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${gradle.ext.cloth_config_version}")
    //     modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${gradle.ext.cloth_config_version}")
    // }

    // IMBlocker：仅开发环境 runClient 体验（26.3 暂无构建，PoC 期注释）
    // if (gradle.ext.has('imblocker_version')) {
    //     modLocalRuntime("maven.modrinth:WMDesFsZ:${gradle.ext.imblocker_version}-fabric")
    // }
}

