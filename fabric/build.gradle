plugins {
    id 'loom-fabric'
}

// 配置屏与加载器源码一起编译；Cloth Config 为玩家可选依赖，不嵌入产物。
sourceSets.main.java.srcDir rootProject.file('cloth-ui/src/main/java')


dependencies {
    // fabric-api 的 maven 坐标 group 是 net.fabricmc.fabric-api（双层），写成 net.fabricmc 会 404
    implementation "net.fabricmc.fabric-api:fabric-api:${gradle.ext.fabric_api_version}"
    // zstd-jni 零编译期依赖：由 native-dep-shade.gradle 嵌入 + ZstdRuntimeBridge 隔离加载（勿在此声明）
    implementation 'org.lz4:lz4-java:1.8.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.1'

    // Night Config：编译 + jiJ（Fabric 自管 toml；common 源码合并进本模块编译）
    compileOnly "com.electronwill.night-config:core:3.6.7"
    compileOnly "com.electronwill.night-config:toml:3.6.7"
    include "com.electronwill.night-config:core:3.6.7"
    include "com.electronwill.night-config:toml:3.6.7"


    // Mod Menu：玩家可选安装；开发客户端带入对应 MC 版本的构建以验证入口。
    if (gradle.ext.has('modmenu_version')) {
        compileOnly "maven.modrinth:modmenu:${gradle.ext.modmenu_version}"
        runtimeOnly "maven.modrinth:modmenu:${gradle.ext.modmenu_version}"
    }

    // 26.x 无需重映射，使用标准 Java 依赖配置；运行依赖仅供开发，不 jiJ。
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${gradle.ext.cloth_config_version}") {
        transitive = false
    }
    runtimeOnly("me.shedaniel.cloth:cloth-config-fabric:${gradle.ext.cloth_config_version}") {
        transitive = false
    }

    // IMBlocker 开发运行接入保持关闭，与可选配置屏依赖无关。
    // if (gradle.ext.has('imblocker_version')) {
    //     runtimeOnly("maven.modrinth:WMDesFsZ:${gradle.ext.imblocker_version}-fabric")
    // }
}

