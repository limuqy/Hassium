            // 1.21.5+（cloth_config_version 18+）上游停发 forge 变体，forge 不引 cloth，
            // HassiumClothConfigScreen 直接引用 Cloth API 类会编译失败 -> 排除整个 cloth-ui srcDir。
            // 为保留 forge 1.21.1（cloth 15）构建路径不变，这里仅在 clothMajor > 17 时跳过 srcDir。
            if (!(gradle.ext.has('cloth_config_version')
                    && (gradle.ext.cloth_config_version as String).tokenize('.')[0].isInteger()
