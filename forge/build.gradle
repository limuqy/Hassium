}

configurations {
    library
    // 原始 kcp 坐标；剥离 io.netty.bootstrap 后再进 game layer（见 stripKcpNettyBootstrapPackage）
    kcpIncoming
}
// Keep these libs on the compile/shade classpath...
configurations.implementation.extendsFrom(configurations.library)
// ...and inject them into the FML game-layer classpath (legacy_classpath.txt) so they
// load in dev runs, not just in the shaded production jar.
configurations.minecraftLibraries.extendsFrom(configurations.library)
// Also put them on the JVM runtime classpath so the Mixin transformer (modlauncher)
// can resolve classes like ZstdDictCompress during transformation.
configurations.minecraftRuntimeLibraries.extendsFrom(configurations.library)

// common 的 implementation kcp 会经 project(':common') 透传；必须挡住未剥离副本，
// 否则与 library 的剥离 jar 并存时，仍可能由未剥离 jar 抢占 io.netty.bootstrap。
configurations.implementation {
    exclude group: 'moe.sdl.kcp', module: 'kcp-netty'
}
configurations.runtimeClasspath {
    exclude group: 'moe.sdl.kcp', module: 'kcp-netty'
}

/**
 * kcp-netty 自带 {@code io.netty.bootstrap.UkcpServerBootstrap}，与 MC 的
 * {@code Bootstrap}/{@code ServerBootstrap} 同包。Forge SecureJarHandler 的 PackageTracker
 * 按「先到的 jar 独占包」处理——kcp 先占 {@code io.netty.bootstrap} 后，MC/mod 侧
 * {@code Class.forName(Bootstrap)} 直接 ClassNotFoundException（vanilla TCP 监听也会挂）。
 * Hassium 只用 {@code io.jpower.kcp.netty.Kcp}，不需要 Ukcp* Bootstrap；剥离整个 {@code io/netty/}。
 */
def hassiumStripKcpNettyBootstrap = { File src, File out ->
    out.parentFile.mkdirs()
    out.withOutputStream { fos ->
        def zos = new ZipOutputStream(fos)
        src.withInputStream { fis ->
            def zis = new ZipInputStream(fis)
            ZipEntry entry
            while ((entry = zis.nextEntry) != null) {
                if (entry.name.startsWith('io/netty/')) {
                    zis.closeEntry()
                    continue
                }
                if (!entry.isDirectory()) {
                    zos.putNextEntry(new ZipEntry(entry.name))
                    zis.transferTo(zos)
                    zos.closeEntry()
                }
                zis.closeEntry()
            }
            zis.close()
        }
        zos.close()
    }
    return out
}

def patchedKcpJar = layout.buildDirectory.file('patched-kcp/kcp-netty-1.6.2-no-netty-bootstrap.jar')

def stripKcpTask = tasks.register('stripKcpNettyBootstrapPackage') {
    description = 'Strip io.netty.bootstrap.* from kcp-netty so Forge JPMS package ownership stays with MC Netty'
    inputs.files(configurations.kcpIncoming)
    outputs.file(patchedKcpJar)
    doLast {
        def src = configurations.kcpIncoming.files.find { it.name.startsWith('kcp-netty-') }
        if (src == null) {
            throw new GradleException("kcp-netty jar not found in kcpIncoming: ${configurations.kcpIncoming.files}")
        }
        def out = patchedKcpJar.get().asFile
        def stamp = new File(out.parent, out.name + '.stamp')
        def stampVal = "${src.canonicalPath}|${src.lastModified()}|${src.length()}"
        if (out.exists() && stamp.exists() && stamp.text.trim() == stampVal) {
            return
        }
        hassiumStripKcpNettyBootstrap(src, out)
        stamp.text = stampVal
    }
}


// Mixin AP 配置：禁用目标验证（architectury-loom 的 remapping 会在运行时处理）
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Arequires=0')
    options.compilerArgs.add('-AdefaultObfuscationEnv=mojang')
}

dependencies {
    library 'com.github.luben:zstd-jni:1.5.5-7'
    library 'org.lz4:lz4-java:1.8.0'
    library 'com.google.code.findbugs:jsr305:3.0.1'

    // UDP 数据面 (KCP-over-UDP)；原始坐标仅用于剥离任务输入，
    // 真正进 compile / game layer / JiJ 的是剥离后的 jar（避免 io.netty.bootstrap 包冲突）。
    kcpIncoming('moe.sdl.kcp:kcp-netty:1.6.2') {
        exclude group: 'io.netty'
    }
    // files(task) 会把 task outputs 挂到依赖图，compile/run 自动 dependsOn 剥离任务。
    library files(stripKcpTask)
    // 生产 jar 内嵌剥离版 kcp：不再用 include（Loom processIncludeJars 拒收裸 File
    // artifact），改走 zstd-jni 同款 shade——见本文件末尾 jar {} 的 from(zipTree(patchedKcpJar)) 块。



    // Cloth Config：编译期需要；可选依赖，不 jiJ
    // cloth-config-forge 变体最高仅 17.0.144（对应 MC 1.21.4）；1.21.5+（cloth_config_version 18+）
    // 上游停发 forge 变体。forge 子项目在无 forge 变体的版本上直接不引 cloth-config，
    // HassiumForgeConfigScreens 用反射探测 cloth 是否存在 → 不可用时 GUI 退化为无 GUI，核心功能不受影响。
    // fabric / neoforge 子项目各自 build.gradle 独立引对应变体，1.21.5+ 仍有 cloth 不受影响。
    if (gradle.ext.has('cloth_config_version')) {
        def clothVer = gradle.ext.cloth_config_version as String
        def clothMajor = clothVer.tokenize('.')[0].isInteger() ? clothVer.tokenize('.')[0].toInteger() : 0
        if (clothMajor <= 17) {
            modCompileOnly("me.shedaniel.cloth:cloth-config-forge:${clothVer}")
        }
    }

    // IMBlocker（开发环境输入法阻断）：forge 子项目整体不接入——
    // - 1.20.1 为已撤销组合（由 neoforge 子项目 loom.platform=forge 承担），且 dev runServer
    //   本就崩于 loom MinecraftLocator mods.toml（既有问题）；
    // - 1.20.6+ 维护版本中 IMBlocker forge 变体上游最高支持 1.20.4，无可用变体。
}

/**
 * 去掉 Guava jar 的 Automatic-Module-Name。
 * Loom/jimfs 引入的 guava-32 与 FML game layer 的 guava-31 同名模块冲突时，
 * game layer 副本被 Ignoring duplicate 丢掉 → TRANSFORMER 找不到 InetAddresses。
 * 保留 guava-32 字节码供 jimfs 使用，但不让它占据模块名 com.google.common。
 */
def hassiumStripGuavaAmn = { File src ->
    def outDir = layout.buildDirectory.dir('patched-guava').get().asFile
    outDir.mkdirs()
    def out = new File(outDir, src.name)
    def stamp = new File(outDir, src.name + '.stamp')
    def stampVal = "${src.canonicalPath}|${src.lastModified()}|${src.length()}"
    if (out.exists() && stamp.exists() && stamp.text.trim() == stampVal) {
        return out
    }
    out.withOutputStream { fos ->
        def zos = new ZipOutputStream(fos)
        src.withInputStream { fis ->
            def zis = new ZipInputStream(fis)
            ZipEntry entry
            while ((entry = zis.nextEntry) != null) {
                if (entry.name == 'META-INF/MANIFEST.MF') {
                    def mf = new Manifest(zis)
                    mf.mainAttributes.remove(new java.util.jar.Attributes.Name('Automatic-Module-Name'))
                    zos.putNextEntry(new ZipEntry(entry.name))
                    mf.write(zos)
                    zos.closeEntry()
                } else if (!entry.isDirectory()) {
                    zos.putNextEntry(new ZipEntry(entry.name))
                    zis.transferTo(zos)
                    zos.closeEntry()
                }
                zis.closeEntry()
            }
            zis.close()
        }
        zos.close()
    }
    stamp.text = stampVal
    return out
}

/**
 * Forge 61+ 重映射时会遗漏 `ByteBufCodecs` 外层类及 Forge Items patch 引入的 `Items$1`。
 * 同版本 vanilla named merged jar 提供 ByteBufCodecs；Items$1 则依据 Forge patch 的 SRG 签名直接生成，
 * 以保留其对 Forge `BlockItem#m_6192_` 的覆盖。
 */
def hassiumFindVanillaNamedMergedJar = { File forgeNamedJar ->
    def forgeSuffix = "-forge-${gradle.ext.minecraft_version}-${gradle.ext.forge_loader}"
    def mappingDir = forgeNamedJar.parentFile.name.replace(forgeSuffix, '')
    return new File(forgeNamedJar.parentFile.parentFile.parentFile,
            "minecraft-merged/${mappingDir}/minecraft-merged-${mappingDir}.jar")
}

def hassiumForgeItemsAnonymousClass = { File forgeNamedJar ->
    def outDir = layout.buildDirectory.dir('generated-forge-classes').get().asFile
    def sourceDir = new File(outDir, 'source/net/minecraft/world/item')
    def classFile = new File(outDir, 'classes/net/minecraft/world/item/Items$1.class')
    def stamp = new File(outDir, 'Items$1.stamp')
    def stampVal = "${forgeNamedJar.canonicalPath}|${forgeNamedJar.lastModified()}|${forgeNamedJar.length()}"
    if (classFile.isFile() && stamp.isFile() && stamp.text.trim() == stampVal) {
        return classFile
    }
    sourceDir.mkdirs()
    def sourceFile = new File(sourceDir, 'Items$1.java')
    sourceFile.text = '''package net.minecraft.world.item;

import java.util.Map;
import net.minecraft.world.level.block.Block;

class Items$1 extends BlockItem {
    private final Block[] blocks;

    Items$1(Block block, Item.Properties properties, Block[] blocks) {
        super(block, properties);
        this.blocks = blocks;
    }

    @Override
    public void registerBlocks(Map<Block, Item> map, Item self) {
        super.registerBlocks(map, self);
        for (Block block : blocks) {
            map.put(block, self);
        }
    }
}
'''
    def compiler = javax.tools.ToolProvider.systemJavaCompiler
    if (compiler == null) {
        throw new GradleException('JDK compiler is required to generate Forge Items$1')
    }
    classFile.parentFile.mkdirs()
    def fileManager = compiler.getStandardFileManager(null, null, java.nio.charset.StandardCharsets.UTF_8)
    try {
        def units = fileManager.getJavaFileObjects(sourceFile)
        def options = ['--release', '21', '-classpath', forgeNamedJar.absolutePath,
                '-d', new File(outDir, 'classes').absolutePath]
        if (!compiler.getTask(null, fileManager, null, options, null, units).call()) {
            throw new GradleException('Failed to generate Forge Items$1 class')
        }
    } finally {
        fileManager.close()
    }
    stamp.text = stampVal
    return classFile
}

/**
 * 去掉 minecraft-merged-patched forge jar 的 Automatic-Module-Name（net.minecraftforge.forge）。
 * Loom 把 task.classpath 里的 merged jar 与 ForgeUserdevLocator 注入的 forge-universal.jar 同时
 * 送进 SecureModuleFinder → 后到的 merged jar 被 Ignoring duplicate 丢掉；但 forge-universal.jar
 * 自身在 userdev 模块层下 Class.forName(module, "net.minecraftforge.client.loading.NoVizFallback")
 * 返回 null（package visibility / reobf 限制），触发 ImmediateWindowHandler.DummyProvider
 * .orElseThrow → server 启动即崩。
 * 剥 merged jar 的 AMN：merged jar 不再占据模块名，与 forge-universal 不冲突；merged jar 字节仍在
 * 类路径上供类加载器使用；net.minecraftforge.forge 模块退回由 forge-universal 独占但其字节仍可见。
 * 注意：此 patch 仅在 forge 1.21.x（forgeMajor >= 52）有 ImmediateWindowHandler 致命加载路径时需要；
 * 对 forge 50 / 1.20.6 无害。
 */
def hassiumStripMergedForgeAmn = { File src ->
    def outDir = layout.buildDirectory.dir('patched-forge-merged').get().asFile
    outDir.mkdirs()
    def out = new File(outDir, src.name)
    def stamp = new File(outDir, src.name + '.stamp')
    File vanillaNamedJar = null
    if (gradle.ext.has('forgeMajor') && (gradle.ext.forgeMajor as int) >= 61) {
        vanillaNamedJar = hassiumFindVanillaNamedMergedJar(src)
        if (!vanillaNamedJar.isFile()) {
            throw new GradleException("Vanilla named merged jar was not generated: ${vanillaNamedJar}")
        }
    }
    def stampVal = "items-anonymous-v1|${src.canonicalPath}|${src.lastModified()}|${src.length()}" +
            (vanillaNamedJar == null ? '' : "|${vanillaNamedJar.canonicalPath}|${vanillaNamedJar.lastModified()}|${vanillaNamedJar.length()}")
    if (out.exists() && stamp.exists() && stamp.text.trim() == stampVal) {
        gradle.ext.hassiumForgeMergedJar = out.absolutePath
        gradle.ext.hassiumVanillaNamedJar = vanillaNamedJar?.absolutePath
        return out
    }
    def vanillaZip = vanillaNamedJar == null ? null : new java.util.zip.ZipFile(vanillaNamedJar)
    try {
        out.withOutputStream { fos ->
            def zos = new ZipOutputStream(fos)
            try {
                src.withInputStream { fis ->
                    def zis = new ZipInputStream(fis)
                    ZipEntry entry
                    while ((entry = zis.nextEntry) != null) {
                        if (entry.name == 'META-INF/MANIFEST.MF') {
                            def mf = new Manifest(zis)
                            mf.mainAttributes.remove(new java.util.jar.Attributes.Name('Automatic-Module-Name'))
                            zos.putNextEntry(new ZipEntry(entry.name))
                            mf.write(zos)
                            zos.closeEntry()
                        } else if (entry.name == 'net/minecraft/network/codec/ByteBufCodecs.class' && vanillaZip != null) {
                            def vanillaEntry = vanillaZip.getEntry(entry.name)
                            if (vanillaEntry == null) {
                                throw new GradleException("${entry.name} missing from vanilla named merged jar: ${vanillaNamedJar}")
                            }
                            zos.putNextEntry(new ZipEntry(entry.name))
                            vanillaZip.getInputStream(vanillaEntry).transferTo(zos)
                            zos.closeEntry()
                        } else if (entry.name == 'net/minecraft/world/item/Items.class' && vanillaZip != null) {
                            zos.putNextEntry(new ZipEntry(entry.name))
                            zis.transferTo(zos)
                            zos.closeEntry()
                            zos.putNextEntry(new ZipEntry('net/minecraft/world/item/Items$1.class'))
                            hassiumForgeItemsAnonymousClass(src).withInputStream { it.transferTo(zos) }
                            zos.closeEntry()
                        } else if (!entry.isDirectory()) {
                            zos.putNextEntry(new ZipEntry(entry.name))
                            zis.transferTo(zos)
                            zos.closeEntry()
                        }
                        zis.closeEntry()
                    }
                    zis.close()
                }
            } finally {
                zos.close()
            }
        }
    } finally {
        vanillaZip?.close()
    }
    stamp.text = stampVal
    gradle.ext.hassiumForgeMergedJar = out.absolutePath
    gradle.ext.hassiumVanillaNamedJar = vanillaNamedJar?.absolutePath
    return out
}

/**
 * 把 minecraft-merged-patched forge jar（loom cache 原始 named mapping）拆成两份：
 *  - hassiumStripMergedForgeAmn 还返回一份「剥 AMN」的副本（供 Task.classpath 上的 mcjar 使用，
 *   minecraft 模块名=minecraft，不独占 net.minecraftforge.forge）
 *  - 同时构造 hassium-forge-only.jar：仅保留 net/minecraftforge/ + META-INF/{services,coremods.json,
 *    mods.toml, MANIFEST.MF}（含 AMN=net.minecraftforge.forge）——一份「只含 forge classes 的精简 jar」。
 *
 * R22 策略：client 把 hassium-forge-only.jar 前置到 task.classpath。它含 MinecraftForge.class 但
 * **不含 Minecraft.class**，于是：
 *  - ForgeUserdevLocator.getPathFromResource(MinecraftForge.class) 命中它 → getForgeOnly(filter) 取得
 *    名为 net.minecraftforge.forge、packages 仅 net.minecraftforge.* 的 forge mod
 *  - ForgeDevLaunchHandler.getPathFromResource(Minecraft.class) 命中 strip'd merged jar → minecraft !=
 *    forge → getMinecraftPaths 返回 [minecraft=merged, extra] → mcjar 是 strip'd merged jar（AMN 剥离、
 *    module 名 minecraft、packages 含 net.minecraft.* + net.minecraftforge.*）
 *  - ClasspathLocator.getPathFromResource(DontObfuscate.class) 命中 strip'd merged jar（forge-only.jar 不含
 *    DontObfuscate）→ minecraft 路径等于 ForgeDev 的 minecraft → ClasspathLocator 跳过 merged jar 的
 *    mods.toml，不会额外创建 module 'forge'（packages 全套 → 与 minecraft 重复 export net.minecraft.*
 *    触发 ResolutionException）
 *
 * R21 早期方案直接前置完整 merged jar 副本（含 Minecraft.class 与 DontObfuscate.class），导致
 * ClasspathLocator.minecraft 路径被前置 jar 抢走，merged jar 反被误认为 forge mod ——ResolutionException
 * "Modules minecraft and forge export package net.minecraft.world.entity.player to module mixin.synthetic"。
 */
def hassiumExtractForgeOnlyJar = { File src ->
    def stripOut = hassiumStripMergedForgeAmn(src)
    def odir = layout.buildDirectory.dir('patched-forge-merged-only').get().asFile
    odir.mkdirs()
    def out = new File(odir, "hassium-forge-only.jar")
    def stamp = new File(odir, out.name + '.stamp')
    def stampVal = "${src.canonicalPath}|${src.lastModified()}|${src.length()}"
    def pkgPrefixes = ['net/minecraftforge/', 'META-INF/services/',
                       'META-INF/coremods.json', 'META-INF/mods.toml']
    if (!(out.exists() && stamp.exists() && stamp.text.trim() == stampVal)) {
        out.withOutputStream { fos ->
            def zos = new ZipOutputStream(fos)
            src.withInputStream { fis ->
                def zis = new ZipInputStream(fis)
                ZipEntry entry
                while ((entry = zis.nextEntry) != null) {
                    def keep = false
                    if (entry.name == 'META-INF/MANIFEST.MF') {
                        keep = true
                    } else if (!entry.isDirectory()) {
                        // 复刻 ForgeUserdevLocator.getForgeOnly 的 filter：非 .class 一律保留
                        // (由此 forge 的 assets/forge/** 资源路径全部 keep)，.class 仅保留 forge packages +
                        // META-INF/{services/,coremods.json,mods.toml}（与 getForgeOnly.getPackages() 一致）。
                        if (!entry.name.endsWith('.class')) {
                            keep = true
                        } else {
                            for (def p : pkgPrefixes) {
                                if (entry.name.startsWith(p)) { keep = true; break }
                            }
                        }
                    }
                    if (keep && !entry.isDirectory()) {
                        zos.putNextEntry(new ZipEntry(entry.name))
                        zis.transferTo(zos)
                        zos.closeEntry()
                    }
                    zis.closeEntry()
                }
                zis.close()
            }
            zos.close()
        }
        stamp.text = stampVal
    }
    gradle.ext.hassiumForgeOnlyJar = out.absolutePath
    gradle.ext.hassiumForgeNamedJar = out.absolutePath   // 兼容旧变量名（R21 的 prepend 块仍读 named jar 路径）
    return stripOut
}

// Forge 模块仅构建 1.20.1 / 1.20.6（1.21+ 已从 builds_for 移除）。
// Forge 50+ / architectury-loom 开发环境 module path 冲突：
// 1) loom#191：classpath 仅有 LWJGL natives → 服务端整段移除
// 2) loom#308：去掉 fabric-log4j-util，避免与 terminalconsoleappender 冲突
// 3) 去掉已合并源码的 hassium-common jar，避免与 hassium 模块重复 export
// 4) guava-32 Automatic-Module-Name 与 game-layer guava-31 冲突 → 剥 AMN
//
// 必须用 FileCollection.filter，不能 project.files([...]) 重建：
// 后者会丢掉对 compileJava/processResources 的任务依赖，导致未编译时
// MOD_CLASSES 全是不存在路径 → SecureJar "Invalid paths argument"。
afterEvaluate {
    def forgeLoader = gradle.ext.has('forge_loader') ? (gradle.ext.forge_loader as String) : ''
    def forgeMajor = forgeLoader.tokenize('.')[0]?.isInteger() ? (forgeLoader.tokenize('.')[0] as int) : 0
    gradle.ext.forgeMajor = forgeMajor
    if (forgeMajor < 50) {
        return
    }
    // forge 52+ SecureJarHandler duplicate-module: forge-universal.jar（Loom cache, ForgeUserdevLocator 注入游戏层）
    // 与 minecraft-merged-patched.jar（task.classpath, MinecraftLocator 注入）同持 AMN=net.minecraftforge.forge。
    // 两份后到者被 Ignoring duplicate；forge-universal 是 reobf srg 字节，Class.forName(module, "NoVizFallback")
    // 在 named mapping 模块层下返回 null → ImmediateWindowHandler $DummyProvider / fmlearlywindow DisplayWindow
    // .updateModuleReads 触发 NPE / IllegalStateException → 启动即崩。
    // 修：剥 forge-universal.jar 的 AMN，使其成 unnamed module；merged-patched.jar（named，含 NoVizFallback 可反射）
    // 独占 net.minecraftforge.forge 模块。server 不调 updateModuleReads 无害，client/真 provider 必须这一步。
    def gradleUserHome = gradle.gradleUserHomeDir
    def mcVer = gradle.ext.has('minecraft_version') ? (gradle.ext.minecraft_version as String) : (gradle.ext.has('mc_ver') ? (gradle.ext.mc_ver as String) : '')
    def universalJar = new File(gradleUserHome, "caches/fabric-loom/${mcVer}/forge/${mcVer}-${forgeLoader}/forge-universal.jar")
    gradle.ext.hassiumUniversalJar = universalJar.absolutePath
    tasks.register('verifyForgeRuntimeByteBufCodecs') {
        group = 'verification'
        description = 'Verifies the actual Forge 61+ named runtime ByteBufCodecs outer class matches vanilla.'
        dependsOn(tasks.named('configureLaunch'))
        doLast {
            if (forgeMajor < 61) {
                return
            }
            tasks.named('runServer').get().classpath.files
            def runtimePath = gradle.ext.has('hassiumForgeMergedJar') ? (gradle.ext.hassiumForgeMergedJar as String) : null
            def vanillaPath = gradle.ext.has('hassiumVanillaNamedJar') ? (gradle.ext.hassiumVanillaNamedJar as String) : null
            def runtimeJar = runtimePath == null ? null : new File(runtimePath)
            def vanillaJar = vanillaPath == null ? null : new File(vanillaPath)
            if (runtimeJar == null || vanillaJar == null || !runtimeJar.isFile() || !vanillaJar.isFile()) {
                throw new GradleException("Forge named runtime jars were not prepared: runtime=${runtimeJar}, vanilla=${vanillaJar}")
            }
            def entryName = 'net/minecraft/network/codec/ByteBufCodecs.class'
            def runtimeZip = new java.util.zip.ZipFile(runtimeJar)
            def vanillaZip = new java.util.zip.ZipFile(vanillaJar)
            try {
                def runtimeEntry = runtimeZip.getEntry(entryName)
                def vanillaEntry = vanillaZip.getEntry(entryName)
                if (runtimeEntry == null || vanillaEntry == null) {
                    throw new GradleException("${entryName} missing from Forge named runtime jars")
                }
                if (!java.util.Arrays.equals(runtimeZip.getInputStream(runtimeEntry).readAllBytes(),
                        vanillaZip.getInputStream(vanillaEntry).readAllBytes())) {
                    throw new GradleException("Forge runtime ${entryName} differs from matching vanilla named source")
                }
                def itemsAnonymousEntry = runtimeZip.getEntry('net/minecraft/world/item/Items$1.class')
                if (itemsAnonymousEntry == null) {
                    throw new GradleException('Forge runtime is missing Items$1.class required by the Forge Items patch')
                }
            } finally {
                vanillaZip.close()
                runtimeZip.close()
            }
        }
    }
    if (universalJar.exists() && forgeMajor >= 52) {
        try {
            def repr = "${universalJar.absolutePath}|${universalJar.lastModified()}|${universalJar.length()}"
            def outJar = new File(layout.buildDirectory.dir('patched-forge-universal').get().asFile, universalJar.name)
            def stamp = new File(outJar.parentFile, outJar.name + '.stamp')
            outJar.parentFile.mkdirs()
            if (!(outJar.exists() && stamp.exists() && stamp.text.trim() == repr)) {
                def sigNames = ['META-INF/FORGE.SF', 'META-INF/FORGE.RSA', 'META-INF/FORGE.DSA', 'META-INF/FORGE.EC', 'META-INF/SIGNATURE.SF', 'META-INF/SIGNATURE.RSA', 'META-INF/SIGNATURE.DSA', 'META-INF/SIGNATURE.EC'] as Set
                outJar.withOutputStream { fos ->
                    def zos = new ZipOutputStream(fos)
                    universalJar.withInputStream { fis ->
                        def zis = new ZipInputStream(fis)
                        ZipEntry entry
                        while ((entry = zis.nextEntry) != null) {
                            if (sigNames.contains(entry.name)) {
                                zis.closeEntry()
                                continue
                            }
                            if (entry.name == 'META-INF/MANIFEST.MF') {
                                def mf = new Manifest(zis)
                                def amnName = new java.util.jar.Attributes.Name('Automatic-Module-Name')
                                if (mf.mainAttributes.getValue(amnName) == null) {
                                    mf.mainAttributes.putValue('Automatic-Module-Name', 'net.minecraftforge.forge')
                                }
                                zos.putNextEntry(new ZipEntry(entry.name))
                                mf.write(zos)
                                zos.closeEntry()
                            } else if (!entry.isDirectory()) {
                                zos.putNextEntry(new ZipEntry(entry.name))
                                zis.transferTo(zos)
                                zos.closeEntry()
                            }
                            zis.closeEntry()
                        }
                        zis.close()
                    }
                    zos.close()
                }
                stamp.text = repr
            }
            // 直接覆盖 loom cache 中的 forge-universal.jar（loom 不按 AMN/签名校验重建）
            ant.copy(file: outJar.absolutePath, tofile: universalJar.absolutePath, overwrite: true)
            println "Injected Automatic-Module-Name=net.minecraftforge.forge (and stripped signatures) into forge-universal.jar: ${universalJar.name}"
        } catch (Exception e) {
            println "WARN: failed to inject forge-universal.jar AMN: ${e.message}"
        }
    }
        tasks.matching { it.name.startsWith('run') }.configureEach { task ->
        if (!task.hasProperty('classpath')) {
            return
        }
        boolean server = task.name.toLowerCase().contains('server')
        def original = task.classpath
        // 显式依赖 classes：eager project.files([...]) 会丢掉 FileCollection 的编译依赖
        task.dependsOn(tasks.named('verifyForgeRuntimeByteBufCodecs'))
        task.dependsOn(tasks.named('classes'))
        def rewritten = original.files.findAll { file ->
            def path = file.absolutePath.replace('\\', '/')
            !(server && path.contains('/org.lwjgl/')) &&
                    !path.contains('/fabric-log4j-util/') &&
                    !(file.name.startsWith('hassium-common-') && file.name.endsWith('.jar'))
        }.collect { file ->
            def path = file.absolutePath.replace('\\', '/')
            if (path.contains('/com.google.guava/guava/') && file.name.contains('guava-32')) {
                return hassiumStripGuavaAmn(file)
            }
            // 剥 merge jar 的 AMN（避免与 forge mod 重复命名），同时产出一份仅含 forge classes 的精简 jar
            // (hassium-forge-only.jar, 保留 AMN=net.minecraftforge.forge)，路径存 gradle.ext.hassiumForgeOnlyJar。
            // client 端 prepend 精简 jar 到 task.classpath：让 ForgeUserdevLocator.getPathFromResource(MinecraftForge.class)
            // 先命中它（仅 forge packages，不含 Minecraft.class/DontObfuscate.class），由此创建的 forge mod 名为
            // net.minecraftforge.forge、packages 仅 net.minecraftforge.*（不含 net.minecraft.*），不与 minecraft
            // 模块重复 export。详见 hassiumExtractForgeOnlyJar 注释。返回 strip'd merged jar 供 mcjar 使用。
            if (file.name.contains('forge-') && file.name.contains('minecraft-merged') && !file.name.contains('-sources')) {
                return hassiumExtractForgeOnlyJar(file)
            }
            return file
        }
        task.classpath = project.files(rewritten)

        // client 关键：把 hassium-forge-only.jar 精简版（只含 forge classes + mods.toml + AMN=net.minecraftforge.forge）
        // 前置到 task.classpath。ForgeUserdevLocator.getPathFromResource(MinecraftForge.class) 先命中它（仅 forge 包），
        // 由此 forge mod 模块名=net.minecraftforge.forge、packages 仅 net.minecraftforge.*；
        // 同时 ForgeDevLaunchHandler.getPathFromResource(Minecraft.class) 与 ClasspathLocator.getPathFromResource(DontObfuscate.class)
        // 均命中 strip'd merged jar（forge-only 不含 mc 类）→ minecraft 路径一致 → ClasspathLocator 跳过 merged jar mods.toml，
        // 不会额外创建 module 'forge'（packages 全套 → 与 minecraft 重复 export 触发 ResolutionException）。
        if (!server) {
            def onlyPath = gradle.ext.has('hassiumForgeOnlyJar') ? (gradle.ext.hassiumForgeOnlyJar as String) : null
            def onlyJar = onlyPath ? new File(onlyPath) : null
            if (onlyJar == null || !onlyJar.exists()) {
                println "WARN: hassium-forge-only jar not found (merged not prepped?), skipping prepend"
            } else {
                println "HASSIUM_DEBUG prepending hassium-forge-only jar to classpath: ${onlyJar.absolutePath}"
                task.classpath = project.files(onlyJar) + task.classpath
            }
        }
        // 1.21.5+ architectury-loom 1.13.469 在 launch.cfg 里加了 `clientdataArgs` section，
        // 但旧版 dev-launch-injector 0.2.1+build.8 的 parseConfig 只认 `Args`/`Properties` 后缀
        // （startsWith("client") + substring=="dataArgs" -> IOException "invalid attribute"）
        // 一旦抛错 dli 就整段进入 pass-through mode，连 clientArgs 里的 --launchTarget 都丢失，
        // ModLauncher args 不再含 --launchTarget -> ImmediateWindowHandler.load 收到 null -> NPE 启动即崩。
        // 修：doFirst 在启动 Java 进程之前重命名 clientdataArgs 行为非 common/非 client 前缀，
        // 让 dli 把该 section 当作环境不匹配 -> STATE_SKIP，整段 clientArgs 仍正常注入。
        task.doFirst {
            def cfg = new File(rootProject.projectDir, 'forge/.gradle/loom-cache/launch.cfg')
            println "HASSIUM_DEBUG doFirst cfg path=" + cfg.absolutePath + " exists=" + cfg.exists() + " length=" + (cfg.exists() ? cfg.length() : -1)
            if (cfg.exists()) {
                def content = cfg.text
                if (content.contains('clientdataArgs') && !content.contains('xclientdataArgs')) {
                    def newContent = content.replaceFirst('(?m)^clientdataArgs\\s*$', 'xclientdataArgs')
                    cfg.write(newContent)
                    println "HASSIUM_DEBUG rewrote launch.cfg clientdataArgs -> xclientdataArgs; new length=" + cfg.length()
                    def verify = cfg.text
                    println "HASSIUM_DEBUG after write: xclientdataArgs=" + verify.contains('xclientdataArgs') + " clientdataArgs=" + verify.contains('clientdataArgs')
                } else {
                    println "HASSIUM_DEBUG launch.cfg no rewrite (hasC=" + content.contains('clientdataArgs') + " hasX=" + content.contains('xclientdataArgs') + ")"
                }
            }
        }
        task.doFirst {
            // DIAG: print task.classpath files containing forge-universal or merged
            println 'HASSIUM_DEBUG task.classpath files (forge-related):'
            task.classpath.files.each { f ->
                def n = f.name
                if (n.contains('forge-universal') || n.contains('minecraft-merged') || (n.contains('forge-') && n.toLowerCase().contains('forge'))) {
                    println '  ' + f.absolutePath
                }
            }
        }
        task.doFirst {
            // IDEA/Loom 会把 out/production 写进 MOD_CLASSES；Gradle 输出只在 build/。
            def modClasses = environment.get('MOD_CLASSES')
            if (modClasses instanceof String && !modClasses.isEmpty()) {
                def kept = modClasses.split(';').findAll { entry ->
                    def parts = entry.split('%%', 2)
                    parts.length < 2 || new File(parts[1]).exists()
                }
                if (kept) {
                    environment('MOD_CLASSES', kept.join(';'))
                }
            }
        }
    }
}


jar {
    dependsOn stripKcpTask
    from(zipTree(patchedKcpJar.get().asFile)) {
        exclude 'META-INF/**'
    }
}
