import java.util.jar.Manifest
import java.util.zip.ZipEntry
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream

plugins {
    id 'loom-forge'
}

sourceSets {
    main {
        java {
            srcDir rootProject.file('cloth-ui/src/main/java')
        }
    }
}

configurations {
    library
    // 原始 kcp 坐标；剥离 io.netty.bootstrap 后再进 game layer（见 stripKcpNettyBootstrapPackage）
    kcpIncoming
    // 原始 FCAP 坐标；剥除其 JiJ MixinExtras 后再进 classpath / include（见 stripFcapMixinExtrasJij）
    fcapIncoming
}
// Keep these libs on the compile/shade classpath...
configurations.implementation.extendsFrom(configurations.library)
// ...and inject them into the FML game-layer classpath (legacy_classpath.txt) so they
// load in dev runs, not just in the shaded production jar.
configurations.minecraftLibraries.extendsFrom(configurations.library)
// Also put them on the JVM runtime classpath so the Mixin transformer (modlauncher)
// can resolve classes like ZstdDictCompress during transformation.
configurations.minecraftRuntimeLibraries.extendsFrom(configurations.library)

// common 的 implementation kcp 会经 project(':common') 透传；必须挡住未剥离副本，
// 否则与 library 的剥离 jar 并存时，仍可能由未剥离 jar 抢占 io.netty.bootstrap。
configurations.implementation {
    exclude group: 'moe.sdl.kcp', module: 'kcp-netty'
}
configurations.runtimeClasspath {
    exclude group: 'moe.sdl.kcp', module: 'kcp-netty'
}

/**
 * kcp-netty 自带 {@code io.netty.bootstrap.UkcpServerBootstrap}，与 MC 的
 * {@code Bootstrap}/{@code ServerBootstrap} 同包。Forge SecureJarHandler 的 PackageTracker
 * 按「先到的 jar 独占包」处理——kcp 先占 {@code io.netty.bootstrap} 后，MC/mod 侧
 * {@code Class.forName(Bootstrap)} 直接 ClassNotFoundException（vanilla TCP 监听也会挂）。
 * Hassium 只用 {@code io.jpower.kcp.netty.Kcp}，不需要 Ukcp* Bootstrap；剥离整个 {@code io/netty/}。
 */
def hassiumStripKcpNettyBootstrap = { File src, File out ->
    out.parentFile.mkdirs()
    out.withOutputStream { fos ->
        def zos = new ZipOutputStream(fos)
        src.withInputStream { fis ->
            def zis = new ZipInputStream(fis)
            ZipEntry entry
            while ((entry = zis.nextEntry) != null) {
                if (entry.name.startsWith('io/netty/')) {
                    zis.closeEntry()
                    continue
                }
                if (!entry.isDirectory()) {
                    zos.putNextEntry(new ZipEntry(entry.name))
                    zis.transferTo(zos)
                    zos.closeEntry()
                }
                zis.closeEntry()
            }
            zis.close()
        }
        zos.close()
    }
    return out
}

def patchedKcpJar = layout.buildDirectory.file('patched-kcp/kcp-netty-1.6.2-no-netty-bootstrap.jar')

def stripKcpTask = tasks.register('stripKcpNettyBootstrapPackage') {
    description = 'Strip io.netty.bootstrap.* from kcp-netty so Forge JPMS package ownership stays with MC Netty'
    inputs.files(configurations.kcpIncoming)
    outputs.file(patchedKcpJar)
    doLast {
        def src = configurations.kcpIncoming.files.find { it.name.startsWith('kcp-netty-') }
        if (src == null) {
            throw new GradleException("kcp-netty jar not found in kcpIncoming: ${configurations.kcpIncoming.files}")
        }
        def out = patchedKcpJar.get().asFile
        def stamp = new File(out.parent, out.name + '.stamp')
        def stampVal = "${src.canonicalPath}|${src.lastModified()}|${src.length()}"
        if (out.exists() && stamp.exists() && stamp.text.trim() == stampVal) {
            return
        }
        hassiumStripKcpNettyBootstrap(src, out)
        stamp.text = stampVal
    }
}

/**
 * FCAP Forge 内嵌 {@code META-INF/jars/mixinextras-forge-*.jar}，而该 jar 又嵌
 * {@code MixinExtras-*.jar}。JarInJarDependencyLocator 会把两层都展开成独立模块
 * （{@code MixinExtras} + 传递依赖 {@code mixinextras.common}），Forge 50 JPMS 报
 * 同包双导出 ResolutionException，dev / 生产均无法启动。
 * 剥除 FCAP 的 JiJ 条目并清空 jarjar metadata，只保留 classpath 上单一的
 * mixinextras-common。
 */
def hassiumStripFcapMixinExtrasJij = { File src, File out ->
    out.parentFile.mkdirs()
    out.withOutputStream { fos ->
        def zos = new ZipOutputStream(fos)
        src.withInputStream { fis ->
            def zis = new ZipInputStream(fis)
            ZipEntry entry
            while ((entry = zis.nextEntry) != null) {
                if (entry.name.startsWith('META-INF/jars/')) {
                    zis.closeEntry()
                    continue
                }
                if (entry.name == 'META-INF/jarjar/metadata.json') {
                    zos.putNextEntry(new ZipEntry(entry.name))
                    zos.write('{"jars":[]}'.getBytes('UTF-8'))
                    zos.closeEntry()
                    zis.closeEntry()
                    continue
                }
                if (!entry.isDirectory()) {
                    zos.putNextEntry(new ZipEntry(entry.name))
                    zis.transferTo(zos)
                    zos.closeEntry()
                }
                zis.closeEntry()
            }
            zis.close()
        }
        zos.close()
    }
    return out
}

def patchedFcapJar = layout.buildDirectory.file('patched-fcap/forgeconfigapiport-forge-no-mixinextras-jij.jar')

def stripFcapTask = tasks.register('stripFcapMixinExtrasJij') {
    description = 'Strip MixinExtras Jar-in-Jar from FCAP Forge to avoid Forge 50 JPMS duplicate package export'
    onlyIf { gradle.ext.minecraft_version == '1.20.6' && gradle.ext.has('forge_config_api_port_version') }
    inputs.files(configurations.fcapIncoming)
    outputs.file(patchedFcapJar)
    doLast {
        def src = configurations.fcapIncoming.files.find { it.name.startsWith('forgeconfigapiport-forge-') }
        if (src == null) {
            throw new GradleException("FCAP forge jar not found in fcapIncoming: ${configurations.fcapIncoming.files}")
        }
        def out = patchedFcapJar.get().asFile
        def stamp = new File(out.parentFile, out.name + '.stamp')
        def stampVal = "${src.canonicalPath}|${src.lastModified()}|${src.length()}"
        if (out.exists() && stamp.exists() && stamp.text.trim() == stampVal) {
            return
        }
        hassiumStripFcapMixinExtrasJij(src, out)
        stamp.text = stampVal
    }
}

// Mixin AP 配置：禁用目标验证（architectury-loom 的 remapping 会在运行时处理）
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Arequires=0')
    options.compilerArgs.add('-AdefaultObfuscationEnv=mojang')
}

dependencies {
    library 'com.github.luben:zstd-jni:1.5.5-7'
    library 'org.lz4:lz4-java:1.8.0'
    library 'com.google.code.findbugs:jsr305:3.0.1'

    // UDP 数据面 (KCP-over-UDP)；原始坐标仅用于剥离任务输入，
    // 真正进 compile / game layer / JiJ 的是剥离后的 jar（避免 io.netty.bootstrap 包冲突）。
    kcpIncoming('moe.sdl.kcp:kcp-netty:1.6.2') {
        exclude group: 'io.netty'
    }
    // files(task) 会把 task outputs 挂到依赖图，compile/run 自动 dependsOn 剥离任务。
    library files(stripKcpTask)
    include files(stripKcpTask)


    // Cloth Config：编译期需要；可选依赖，不 jiJ
    if (gradle.ext.has('cloth_config_version')) {
        modCompileOnly("me.shedaniel.cloth:cloth-config-forge:${gradle.ext.cloth_config_version}")
    }
}

/**
 * 去掉 Guava jar 的 Automatic-Module-Name。
 * Loom/jimfs 引入的 guava-32 与 FML game layer 的 guava-31 同名模块冲突时，
 * game layer 副本被 Ignoring duplicate 丢掉 → TRANSFORMER 找不到 InetAddresses。
 * 保留 guava-32 字节码供 jimfs 使用，但不让它占据模块名 com.google.common。
 */
def hassiumStripGuavaAmn = { File src ->
    def outDir = layout.buildDirectory.dir('patched-guava').get().asFile
    outDir.mkdirs()
    def out = new File(outDir, src.name)
    def stamp = new File(outDir, src.name + '.stamp')
    def stampVal = "${src.canonicalPath}|${src.lastModified()}|${src.length()}"
    if (out.exists() && stamp.exists() && stamp.text.trim() == stampVal) {
        return out
    }
    out.withOutputStream { fos ->
        def zos = new ZipOutputStream(fos)
        src.withInputStream { fis ->
            def zis = new ZipInputStream(fis)
            ZipEntry entry
            while ((entry = zis.nextEntry) != null) {
                if (entry.name == 'META-INF/MANIFEST.MF') {
                    def mf = new Manifest(zis)
                    mf.mainAttributes.remove(new java.util.jar.Attributes.Name('Automatic-Module-Name'))
                    zos.putNextEntry(new ZipEntry(entry.name))
                    mf.write(zos)
                    zos.closeEntry()
                } else if (!entry.isDirectory()) {
                    zos.putNextEntry(new ZipEntry(entry.name))
                    zis.transferTo(zos)
                    zos.closeEntry()
                }
                zis.closeEntry()
            }
            zis.close()
        }
        zos.close()
    }
    stamp.text = stampVal
    return out
}

// Forge 模块仅构建 1.20.1 / 1.20.6（1.21+ 已从 builds_for 移除）。
// Forge 50+ / architectury-loom 开发环境 module path 冲突：
// 1) loom#191：classpath 仅有 LWJGL natives → 服务端整段移除
// 2) loom#308：去掉 fabric-log4j-util，避免与 terminalconsoleappender 冲突
// 3) 去掉已合并源码的 hassium-common jar，避免与 hassium 模块重复 export
// 4) guava-32 Automatic-Module-Name 与 game-layer guava-31 冲突 → 剥 AMN
//
// 必须用 FileCollection.filter，不能 project.files([...]) 重建：
// 后者会丢掉对 compileJava/processResources 的任务依赖，导致未编译时
// MOD_CLASSES 全是不存在路径 → SecureJar "Invalid paths argument"。
afterEvaluate {
    def forgeLoader = gradle.ext.has('forge_loader') ? (gradle.ext.forge_loader as String) : ''
    def forgeMajor = forgeLoader.tokenize('.')[0]?.isInteger() ? (forgeLoader.tokenize('.')[0] as int) : 0
    if (forgeMajor < 50) {
        return
    }
    tasks.matching { it.name.startsWith('run') }.configureEach { task ->
        if (!task.hasProperty('classpath')) {
            return
        }
        boolean server = task.name.toLowerCase().contains('server')
        def original = task.classpath
        // 显式依赖 classes：eager project.files([...]) 会丢掉 FileCollection 的编译依赖
        task.dependsOn(tasks.named('classes'))
        def rewritten = original.files.findAll { file ->
            def path = file.absolutePath.replace('\\', '/')
            !(server && path.contains('/org.lwjgl/')) &&
                    !path.contains('/fabric-log4j-util/') &&
                    !(file.name.startsWith('hassium-common-') && file.name.endsWith('.jar'))
        }.collect { file ->
            def path = file.absolutePath.replace('\\', '/')
            if (path.contains('/com.google.guava/guava/') && file.name.contains('guava-32')) {
                return hassiumStripGuavaAmn(file)
            }
            return file
        }
        task.classpath = project.files(rewritten)

        task.doFirst {
            // IDEA/Loom 会把 out/production 写进 MOD_CLASSES；Gradle 输出只在 build/。
            def modClasses = environment.get('MOD_CLASSES')
            if (modClasses instanceof String && !modClasses.isEmpty()) {
                def kept = modClasses.split(';').findAll { entry ->
                    def parts = entry.split('%%', 2)
                    parts.length < 2 || new File(parts[1]).exists()
                }
                if (kept) {
                    environment('MOD_CLASSES', kept.join(';'))
                }
            }
        }
    }
}

