# flyroundtrip：往返飞行黑块专项（用户报「出生点已缓存区块往返后大片黑块」）
# 与 classic/lightdiag 同档：关 SeedGen，避免本地生成带偏；开光照探针与写盘/追踪日志。
#
# debug.lightVerify：光包落地探针（CHUNK_PROBE source=light）+ counters.clientDarkLightProbeSamples
#   计数来源；本场景的门禁断言依赖它，缺了会拿到恒 0 的假 PASS。
# debug.chunkApplyLogging：区块 apply（整柱包落地）逐柱日志，用于对齐「同柱是否收到整柱包」。
# debug.asyncLogging：注入/光屏障辅助日志（abort / LightDelta queued 等只在 ASYNC 档）。
# flyroundtrip：往返飞行黑块专项（用户报「出生点已缓存区块往返后大片黑块」）
# 与 classic/lightdiag 同档：关 SeedGen，避免本地生成带偏；开光照探针与写盘/追踪日志。
#
# debug.networkLogging=true：回程 publish/redeliver/缓存命中归因（用户报「往返缓存空」）。
chunk.seedGenEnabled = false
debug.lightVerify = true
debug.chunkApplyLogging = true
debug.asyncLogging = true
debug.networkLogging = true
