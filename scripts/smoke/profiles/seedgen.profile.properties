# seedgen 场景配置档案（T8 harness 落盘：runtime-smoke-test.ps1 Invoke-SmokeProfilePatch 消费）
# 目标键：chunk.seedGenEnabled（ConfigSchema CHUNK_SEED_GEN 族：客户端 CLIENT_CHUNK_SEED_GEN_ENABLED /
# 服务端 SERVER_CHUNK_SEED_GEN_ENABLED，双端同名键、按物理端各自加载）。
# FabricTomlConfigIO 以 NightConfig 点路径写入 → toml 行形态为 [chunk] 表内缩进叶子键
# 「seedGenEnabled = false」，故此处按叶子键名声明（与 smoke-config-patch.ps1 行匹配机制一致，
# 双端 toml 各命中一行）。值须为合法 TOML 字面量。
# 注意：服务端开启 SeedGen 会向客户端下发世界种子（等同泄露服务端种子）——本档案仅冒烟使用。
seedGenEnabled=true
