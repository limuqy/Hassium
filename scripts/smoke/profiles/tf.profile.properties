# tf 场景档案：与历史 PASS（1.21.1_fabric_I_tf4）同口径——默认不启用 seedGen。
# seedGen+TF 已由 ServerLifecycleHooksCompat 支持（§7c）；需要时可把 seedGenEnabled=true。
#
# chunk.seedGenEnabled=false 必须显式钉死：本键跨场次持久（run/{client,server}/config/hassium），
# 历史 seedgen 场次会把 neoforge 侧留成 true → TF 场变成「本地生成」路径，
# 交付口径与 fabric 场不可比（实测 1.21.1_neoforge_I_cl_tf：locallyGenerated=2418、
# ClientChunkCache 空）。与 classic / modcompat / modcompat_strict 档同做法。
chunk.seedGenEnabled = false
debug.networkMetricsEnabled = true
