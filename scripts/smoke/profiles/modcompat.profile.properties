# modcompat 场景配置档案（runtime-smoke-test.ps1 的 Invoke-SmokeProfilePatch 消费）。
#
# 与 seedgen 同档：客户端指标（门禁读 probe counters）。
# 刻意不写 storage.enabled —— 它是 SERVER-only 键，而本档案会同时 patch 客户端 toml；
# C2ME 写侧接管的主要目标是影子端（hassium_cache 恒写 type 126，不受该开关约束），
# 服务端 126 由使用方按需自行开启。
# seedGenEnabled=false：网络-only 对照；本地生成柱不进 networkReceived，
# 不应被 readyNotApplied（ready−applied）之外的 actualPresent 口径误伤。
chunk.seedGenEnabled = false
debug.networkMetricsEnabled = true
