plugins {
    id 'dev.architectury.loom'
    id 'common'
}

loom {
    silentMojangMappingsLicense()
}

dependencies {
    minecraft "com.mojang:minecraft:${gradle.ext.minecraft_version}"
    mappings loom.officialMojangMappings()
}

if (project.name == "common") return // Don't apply the code below to the common project

// loom 1.17.491 + Gradle 9.6：fabric 平台 remapJar 任务依赖计算会解析 compileClasspath 的构建依赖图，
// 途中需实例化 compileJava；compileJava 创建时又以 compileClasspath 为 classpath 再次解析其构建依赖图，
// Gradle 9 的 markAsObserved 检测到该重入直接抛 "Cannot observe dependencies before markAsObserved"，
// 导致 build/remapJar 失败（smoke 只跑 classes/runServer，不碰 remapJar，故此前未暴露）。
// 配置阶段提前实例化 compileJava：任务图阶段不再 tryCreate，打破死锁。
// forge/neoforge 平台未触发，统一提前实例化无副作用（compileJava 本就要执行），
// 兼防其他平台在 loom 后续版本中触发同类重入。
afterEvaluate {
    tasks.named('compileJava').get()
}

dependencies {
    // 仅编译期 API：运行期类由本模块合并编译产物提供（源码 srcDirs 合并 + jar from output）。
    // 不能 implementation：loom 会把 project 依赖解析为 build/libs 的 remap 产物
    // （intermediary 映射），dev 运行（runClient/runServer）加载后 mixin 签名/目标名错配崩溃。
    compileOnly(project(":common"))
    // compileOnly 不传递 common 的 runtime 依赖，这里显式透传（与 common/build.gradle 同坐标；
    // fabric 自声明的同坐标自动去重）。
    implementation 'com.github.luben:zstd-jni:1.5.5-7'
    implementation 'org.lz4:lz4-java:1.8.0'
    implementation 'com.electronwill.night-config:core:3.6.7'
    implementation 'com.electronwill.night-config:toml:3.6.7'
}

// loader 模块合并 common 源码，随 loader jar 一起编译
afterEvaluate {
    sourceSets.main {
        java.srcDirs += project(':common').sourceSets.main.java.srcDirs
        resources.srcDirs += project(':common').sourceSets.main.resources.srcDirs
    }
}

tasks.named('jar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':common').sourceSets.main.output)
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(":common").sourceSets.main.resources
}
