plugins {
    id 'minecraft'
    id 'native-dep-shade'
    id 'publish-curseforge'
}

loom {
    forge {
        mixinConfig "${mod_id}.mixins.json"
        mixinConfig "${mod_id}.forge.mixins.json"
    }
}

dependencies {
    forge "net.minecraftforge:forge:${gradle.ext.minecraft_version}-${gradle.ext.forge_loader}"
}

loom {
    runConfigs.configureEach {
        ideConfigGenerated = true
        if (name == 'client') {
            runDir = 'run/client'
            if (project.hasProperty('hassiumSmokeTest') && project.property('hassiumSmokeTest').toString() == 'true') {
                def host = project.findProperty('hassiumSmokeHost') ?: '127.0.0.1:25565'
                def delayMs = project.findProperty('hassiumSmokeDelayMs') ?: '10000'
                def reconnectDelayMs = project.findProperty('hassiumSmokeReconnectDelayMs') ?: '3000'
                def joinTimeoutMs = project.findProperty('hassiumSmokeJoinTimeoutMs') ?: '120000'
                def phases = project.findProperty('hassiumSmokePhases') ?: 'classic'
                def manualLogout = project.findProperty('hassiumSmokeManualLogout')
                // loom 1.17+: RunConfiguration 用 ListProperty<String>；旧版裸 List getter 已 @Deprecated 且
                // getJvmArguments().get() 在配置阶段未 finalize 抛 UnsupportedOperationException。改用
                // ListProperty 原生 addAll/add。
                jvmArguments.addAll([
                        "-Dhassium.smokeTest=true",
                        "-Dhassium.smokeTest.delayMs=${delayMs}",
                        "-Dhassium.smokeTest.reconnectDelayMs=${reconnectDelayMs}",
                        "-Dhassium.smokeTest.joinTimeoutMs=${joinTimeoutMs}",
                        "-Dhassium.smokeTest.host=${host}",
                        "-Dhassium.smokePhases=${phases}",
                        // forge 端 log4j StatusConsoleListener 解析反斜杠 URI 失败后
                        // 在 Console appender 输出时递归（Recursive call to appender Console）
                        // 叠加渲染线程 1024K 栈 → EXCEPTION_STACK_OVERFLOW；关闭 status 输出根治
                        "-Dlog4j2.status=OFF"
                ])
                // T2 PROBE JSON v1：harness 传 -PhassiumSmokeProbeDir 时映射为客户端
                // JVM 属性 hassium.smokeTest.probeDir（ClientSmokeTest 每轮写 roundN.json）
                def probeDir = project.findProperty('hassiumSmokeProbeDir')
                if (probeDir != null && !probeDir.toString().isBlank()) {
                    jvmArguments.add("-Dhassium.smokeTest.probeDir=${probeDir}")
                }
                // T8 场景引擎：harness 传 -PhassiumSmokeScenario=<name> 时映射为客户端
                // JVM 属性 hassium.smokeScenario（ScenarioEngine 加载 scenario/<name>.scenario）
                def smokeScenario = project.findProperty('hassiumSmokeScenario')
                if (smokeScenario != null && !smokeScenario.toString().isBlank()) {
                    jvmArguments.add("-Dhassium.smokeScenario=${smokeScenario}")
                }
                if (manualLogout != null && manualLogout.toString() == 'true') {
                    jvmArguments.add("-Dhassium.smokeTest.manualLogout=true")
                }
                programArguments.addAll([
                        '--quickPlayMultiplayer', host.toString()
                ])
            }
        } else if (name == 'server') {
            runDir = 'run/server'
            if (project.hasProperty('hassiumSmokeTest') && project.property('hassiumSmokeTest').toString() == 'true') {
                // 无 GUI，避免 headless 环境挂起
                programArguments.add('nogui')
                def phases = project.findProperty('hassiumSmokePhases') ?: 'classic'
                jvmArguments.addAll([
                        "-Dhassium.serverSmokeTest=true",
                        "-Dhassium.smokePhases=${phases}"
                ])
                // T7/T8 场景引擎服务端侧：harness 传 -PhassiumServerSmokeScenario=<name> 时
                // 映射为 JVM 属性 hassium.serverSmokeScenario（ScenarioEngine 服务端 op 逻辑）
                def serverSmokeScenario = project.findProperty('hassiumServerSmokeScenario')
                if (serverSmokeScenario != null && !serverSmokeScenario.toString().isBlank()) {
                    jvmArguments.add("-Dhassium.serverSmokeScenario=${serverSmokeScenario}")
                }
            }
        }
    }
}
