import hassium.publish.PublishState

plugins {
    id 'common'
}

// Create a build.properties file at the root with all the preprocessor definitions
def writePreprocessorDefinitions() {
    StringBuilder sb = new StringBuilder();
    sb.append("# Preprocessor definitions generated by build script\n");

    // Add a number to each version, example: MC_1_20_1 = 0, MC_1_21_1 = 1, etc
    gradle.ext.mcVers.eachWithIndex { ver, idx ->
        sb.append("MC_${ver.replace('.', '_')}=${idx}\n")
        if (gradle.ext.mcIndex == idx) sb.append("MC_VER=${idx}\n") // Set the current version
    }

    new File(rootDir, "build.properties").text = sb.toString()
}
writePreprocessorDefinitions()

// 合法 #if 分界（与 docs/version-segments.md 同步）
def ALLOWED_MC_BOUNDARIES = [
        'MC_1_20_1',
        'MC_1_21_1', 'MC_1_21_2', 'MC_1_21_5', 'MC_1_21_6',
        'MC_1_21_9', 'MC_1_21_11'
] as Set

tasks.register('scanVersionBoundaries') {
    group = 'verification'
    description = 'Reject #if MC_1_*_* tokens outside docs/version-segments.md whitelist'
    doLast {
        def pattern = ~/MC_1_\d+_\d+/
        def illegal = []
        ['common', 'fabric', 'forge', 'neoforge'].each { mod ->
            def dir = file(mod)
            if (!dir.exists()) return
            fileTree(dir: dir, include: '**/*.java').each { f ->
                def rel = rootProject.relativePath(f)
                f.eachLine { line, idx ->
                    def m = pattern.matcher(line)
                    while (m.find()) {
                        def token = m.group()
                        if (!ALLOWED_MC_BOUNDARIES.contains(token)) {
                            illegal << "${rel}:${idx + 1}: ${token}"
                        }
                    }
                }
            }
        }
        if (!illegal.isEmpty()) {
            throw new GradleException(
                    "Illegal version boundaries (see docs/version-segments.md):\n  "
                            + illegal.join('\n  '))
        }
        logger.lifecycle('scanVersionBoundaries: OK')
    }
}

// 当前 mc_ver 下已 include 的加载器 → 一并上传 CurseForge
tasks.register('publishCurseForge') {
    group = 'publishing'
    description = 'Upload current mc_ver loader JARs to CurseForge (see scripts/publish-mods.ps1 for all versions)'
}

// 当前 mc_ver 下已 include 的加载器 → 一并上传 Modrinth
tasks.register('publishModrinth') {
    group = 'publishing'
    description = 'Upload current mc_ver loader JARs to Modrinth (see scripts/publish-mods.ps1 for all versions)'
}

afterEvaluate {
    def includedLoaders = ['fabric', 'forge', 'neoforge'].findAll { findProject(":${it}") != null }
    tasks.named('publishCurseForge').configure {
        dependsOn includedLoaders.collect { "${it}:publishCurseForge" }
    }
    tasks.named('publishModrinth').configure {
        dependsOn includedLoaders.collect { "${it}:modrinth" }
    }
}

// 当前 mc_ver 构建一次，两个平台各自上传（避免 build 跑两遍）
tasks.register('publishAll') {
    group = 'publishing'
    description = 'Build current mc_ver once and publish to both CurseForge and Modrinth'
    dependsOn 'publishCurseForge', 'publishModrinth'
}

tasks.register('publishAllVersions') {
    group = 'publishing'
    description = 'Build & publish all versionProperties × builds_for to CurseForge + Modrinth (invokes scripts/publish-mods.*)'
    doLast {
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def script = isWindows
                ? file('scripts/publish-mods.ps1')
                : file('scripts/publish-mods.sh')
        if (!script.exists()) {
            throw new GradleException("Missing ${script}")
        }
        def pb = isWindows
                ? new ProcessBuilder('pwsh', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', script.absolutePath)
                : new ProcessBuilder('bash', script.absolutePath)
        pb.directory(rootDir)
        pb.inheritIO()
        def code = pb.start().waitFor()
        if (code != 0) {
            throw new GradleException("publishAllVersions failed with exit code ${code}")
        }
    }
}

/**
 * 打印当前 mc_ver 各 loader 在两个平台上的发布状态，供 scripts/publish-mods.* 做幂等预检：
 *   PUBLISH_STATE <mc_ver> <loader> cf=yes|no|no-token|unknown(...) mr=... jar=<产物名> mrver=<版本号>
 * 只读 GET，不触发任何构建。
 *
 * 产物名直接取自各 loader 子项目 remapJar 的 archiveFile（与上传用的是同一个真值来源），
 * 因此自动跟随 settings.gradle 的按版本 buildDirectory（<loader>/build/<mc_ver>/libs/...），
 * 不会因为这里另写一套命名公式而与实际产物漂移。
 */
tasks.register('publishState') {
    group = 'publishing'
    description = 'Print per-loader publish state on CurseForge + Modrinth (PUBLISH_STATE lines)'
    doLast {
        def mcVer = gradle.ext.minecraft_version as String
        def loaders = ((String) gradle.ext.builds_for).split(',').collect { it.trim() }.findAll { it }
        def cfProject = (findProperty('curseforge_project_id') ?: '').toString().trim()
        def mrProject = (findProperty('modrinth_project_id') ?: '').toString().trim()
        def cfToken = (System.getenv('CURSEFORGE_TOKEN') ?: (findProperty('curseforge_token') ?: '')).toString()
        def mrToken = (System.getenv('MODRINTH_TOKEN') ?: (findProperty('modrinth_token') ?: '')).toString()
        loaders.each { loader ->
            def loaderProject = findProject(":${loader}")
            if (loaderProject == null) {
                println "PUBLISH_STATE ${mcVer} ${loader} cf=unknown(no-project) mr=unknown(no-project) jar=? mrver=?"
                return
            }
            def jarName = loaderProject.tasks.named('remapJar').get().archiveFile.get().asFile.name
            def mrVersionNumber = "${mod_version}+${mcVer}-${loader}"
            def cfState = PublishState.curseforgeFileState(cfToken, cfProject, jarName)
            def mrState = PublishState.modrinthVersionState(mrToken, mrProject, mrVersionNumber)
            println "PUBLISH_STATE ${mcVer} ${loader} cf=${cfState} mr=${mrState} jar=${jarName} mrver=${mrVersionNumber}"
        }
    }
}
