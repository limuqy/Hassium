plugins {
    id 'minecraft'
    id 'native-dep-shade'
    id 'publish-curseforge'
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${gradle.ext.fabric_loader}"
}

loom {
    // fabric-resource-loader-v1 通过 loom 编译期注入给 MinecraftServer 加 DataResourceStore 接口
    // （common 源码合并进 fabric 模块编译，ShadowSeedServer 被迫实现其抽象方法）。
    // Hassium 不使用 fabric resource API；运行时接口注入由 fabric 的 MinecraftServerMixin 完成，
    // 与 loom 编译期注入无关，禁用依赖注入不影响功能。
    interfaceInjection {
        enableDependencyInterfaceInjection = false
    }
    runConfigs.configureEach {
        ideConfigGenerated = true
        if (name == 'client') {
            runDir = 'run/client'
            // 冒烟：脚本通过 -PhassiumSmokeTest=true 注入 JVM 属性 + quickPlay
            if (project.hasProperty('hassiumSmokeTest') && project.property('hassiumSmokeTest').toString() == 'true') {
                def host = project.findProperty('hassiumSmokeHost') ?: '127.0.0.1:25565'
                def delayMs = project.findProperty('hassiumSmokeDelayMs') ?: '10000'
                def reconnectDelayMs = project.findProperty('hassiumSmokeReconnectDelayMs') ?: '3000'
                def joinTimeoutMs = project.findProperty('hassiumSmokeJoinTimeoutMs') ?: '120000'
                def moveSeconds = project.findProperty('hassiumSmokeMoveSeconds') ?: '0'
                def phases = project.findProperty('hassiumSmokePhases') ?: 'classic'
                def manualLogout = project.findProperty('hassiumSmokeManualLogout')
                def migrateTo = project.findProperty('hassiumSmokeMigrateTo')
                def username = project.findProperty('hassiumSmokeUsername')
                // loom 1.17+: RunConfiguration 用 ListProperty<String>，旧版裸 ArrayList getter 已 @Deprecated 且
                // 内部 getJvmArguments().get() 在配置阶段未 finalize 时抛 UnsupportedOperationException。
                // 改用 ListProperty 原生 addAll/add，避开 deprecated 路径。
                jvmArguments.addAll([
                        "-Dhassium.smokeTest=true",
                        "-Dhassium.smokeTest.delayMs=${delayMs}",
                        "-Dhassium.smokeTest.reconnectDelayMs=${reconnectDelayMs}",
                        "-Dhassium.smokeTest.joinTimeoutMs=${joinTimeoutMs}",
                        "-Dhassium.smokeTest.moveSeconds=${moveSeconds}",
                        "-Dhassium.smokeTest.host=${host}",
                        "-Dhassium.smokePhases=${phases}"
                ])
                if (migrateTo != null && !migrateTo.toString().isBlank()) {
                    jvmArguments.add("-Dhassium.smokeTest.migrateTo=${migrateTo}")
                }
                def migrateImmediate = project.findProperty('hassiumSmokeMigrateImmediate')
                if (migrateImmediate != null) {
                    jvmArguments.add("-Dhassium.smokeTest.migrateImmediate=${migrateImmediate}")
                }
                def migrateMoveSeconds = project.findProperty('hassiumSmokeMigrateMoveSeconds')
                if (migrateMoveSeconds != null) {
                    jvmArguments.add("-Dhassium.smokeTest.migrateMoveSeconds=${migrateMoveSeconds}")
                }
                // T10 迁移演练：固定客户端用户名 → 预热/演练同 UUID（A6 playerdata 命中）。
                // loom dev 环境默认随机用户名（Player+随机），跨会话 UUID 不一致。
                if (username != null && !username.toString().isBlank()) {
                    programArguments.addAll(['--username', username.toString()])
                }
                if (manualLogout != null && manualLogout.toString() == 'true') {
                    jvmArguments.add("-Dhassium.smokeTest.manualLogout=true")
                }
                programArguments.addAll([
                        '--quickPlayMultiplayer', host.toString()
                ])
            }
        } else if (name == 'server') {
            // T10 双主控演练：-PhassiumServerRunDir=run/serverB 让 B 服务端用独立 run 目录
            // （默认 'run/server' 不变，向后兼容既有 smoke 脚本）。
            runDir = project.findProperty('hassiumServerRunDir') ?: 'run/server'
            if (project.hasProperty('hassiumSmokeTest') && project.property('hassiumSmokeTest').toString() == 'true') {
                // 无 GUI，避免头少环境挂起
                programArguments.add('nogui')
                // 服务端冒烟：启动 VD=20，玩家退出后切 VD=8
                def phases = project.findProperty('hassiumSmokePhases') ?: 'classic'
                jvmArguments.addAll([
                        "-Dhassium.serverSmokeTest=true",
                        "-Dhassium.smokePhases=${phases}"
                ])
            }
        }
    }
}
