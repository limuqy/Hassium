plugins {
    id 'minecraft'
    id 'net.neoforged.moddev'
    id 'native-dep-shade'
    id 'publish-curseforge'
    id 'publish-modrinth'
}

// 26.x：neoforge 线 = ModDevGradle（minecraft.gradle 已对本模块跳过 loom）

neoForge {
    version = gradle.ext.neoforge_loader as String

    runs {
        client {
            client()
            gameDirectory = file('run/client')
            // 冒烟：脚本通过 -PhassiumSmokeTest=true 注入 JVM 属性 + quickPlay
            // （loom runConfig 移植；MDG DSL：systemProperty k,v / programArguments）
            if (project.hasProperty('hassiumSmokeTest') && project.property('hassiumSmokeTest').toString() == 'true') {
                def host = project.findProperty('hassiumSmokeHost') ?: '127.0.0.1:25565'
                def delayMs = project.findProperty('hassiumSmokeDelayMs') ?: '10000'
                def reconnectDelayMs = project.findProperty('hassiumSmokeReconnectDelayMs') ?: '3000'
                def joinTimeoutMs = project.findProperty('hassiumSmokeJoinTimeoutMs') ?: '120000'
                def moveSeconds = project.findProperty('hassiumSmokeMoveSeconds') ?: '0'
                def phases = project.findProperty('hassiumSmokePhases') ?: 'classic'
                def manualLogout = project.findProperty('hassiumSmokeManualLogout')
                def username = project.findProperty('hassiumSmokeUsername')
                systemProperty 'hassium.smokeTest', 'true'
                systemProperty 'hassium.smokeTest.delayMs', "${delayMs}"
                systemProperty 'hassium.smokeTest.reconnectDelayMs', "${reconnectDelayMs}"
                systemProperty 'hassium.smokeTest.joinTimeoutMs', "${joinTimeoutMs}"
                systemProperty 'hassium.smokeTest.moveSeconds', "${moveSeconds}"
                systemProperty 'hassium.smokeTest.host', "${host}"
                systemProperty 'hassium.smokePhases', "${phases}"
                def probeDir = project.findProperty('hassiumSmokeProbeDir')
                if (probeDir != null && !probeDir.toString().isBlank()) {
                    systemProperty 'hassium.smokeTest.probeDir', probeDir.toString()
                }
                def smokeScenario = project.findProperty('hassiumSmokeScenario')
                if (smokeScenario != null && !smokeScenario.toString().isBlank()) {
                    systemProperty 'hassium.smokeScenario', smokeScenario.toString()
                }
                def compareFullDumpDir = project.findProperty('hassiumCompareFullDumpDir')
                if (compareFullDumpDir != null && !compareFullDumpDir.toString().isBlank()) {
                    systemProperty 'hassium.compareFullDumpDir', compareFullDumpDir.toString()
                }
                if (manualLogout != null && manualLogout.toString() == 'true') {
                    systemProperty 'hassium.smokeTest.manualLogout', 'true'
                }
                // T10 迁移演练：固定客户端用户名（loom dev 默认随机用户名，跨会话 UUID 不一致）
                if (username != null && !username.toString().isBlank()) {
                    programArguments.addAll('--username', username.toString())
                }
                programArguments.addAll('--quickPlayMultiplayer', host.toString())
            }
        }
        server {
            server()
            gameDirectory = file('run/server')
            if (project.hasProperty('hassiumSmokeTest') && project.property('hassiumSmokeTest').toString() == 'true') {
                programArguments.add('nogui')
                def phases = project.findProperty('hassiumSmokePhases') ?: 'classic'
                def vd1 = project.findProperty('hassiumSmokeVd1') ?: '20'
                def vd2 = project.findProperty('hassiumSmokeVd2') ?: '10'
                systemProperty 'hassium.serverSmokeTest', 'true'
                systemProperty 'hassium.serverSmokeTest.vd1', "${vd1}"
                systemProperty 'hassium.serverSmokeTest.vd2', "${vd2}"
                systemProperty 'hassium.smokePhases', "${phases}"
                def serverSmokeScenario = project.findProperty('hassiumServerSmokeScenario')
                if (serverSmokeScenario != null && !serverSmokeScenario.toString().isBlank()) {
                    systemProperty 'hassium.serverSmokeScenario', serverSmokeScenario.toString()
                }
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// mixin 由 neoforge.mods.toml 的 [[mixins]] 声明
processResources {
    exclude 'META-INF/mods.toml'
}
