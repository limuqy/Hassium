# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/common.gradle expandProps map.

# The current Minecraft anchor; override with -Pmc_ver=26.1.2 or 26.2
# PowerShell: "-Pmc_ver=26.1.2". Old-version 2.x releases use the 2.0.0 branch.
# 注：Fabric 自管 toml+Cloth；NeoForge 使用原生配置 API
mc_ver=26.3

# Mod Info
mod_name=Hassium
mod_author=limuqy
mod_id=hassium
mod_version=3.0.1
group=io.github.limuqy.mc.hassium
license=GPL-3.0-or-later
credits=
description=High-performance chunk compression and client-side caching.

# 发布（两个平台一起推：./gradlew publishAll，或全版本 scripts/publish-mods.ps1）
# 幂等：两平台均已存在对应产物时自动跳过；-Ppublish_skip_existing=false 可关。
#

# CurseForge
# 数字项目 ID：项目页 → About → Project ID
curseforge_project_id=1615043
# release | beta | alpha
curseforge_release_type=release
# Token 勿写进本文件：用环境变量 CURSEFORGE_TOKEN，或本机 ~/.gradle/gradle.properties 的 curseforge_token=
# 干跑（只打印请求不上传）：-Pcurseforge_debug=true
#
# Modrinth（项目 ID 或 slug 均可）
modrinth_project_id=Omz3Trqw
# release | beta | alpha
modrinth_release_type=release
# Environment：client_or_server_prefers_both =「双端安装更佳」（单端可运行）
modrinth_environment=client_or_server_prefers_both
# Token 勿写进本文件：用环境变量 MODRINTH_TOKEN，或本机 ~/.gradle/gradle.properties 的 modrinth_token=
# scope 需含「创建版本」；干跑：-Pmodrinth_debug=true
# 版本号规则：<mod_version>+<mc_ver>-<loader>（Modrinth 要求同项目内唯一，故必须带 loader 后缀）

# Manifold
manifold_version=2026.1.6

# zstd-jni（运行时隔离加载，见 compression/ZstdRuntimeBridge；唯一版本源：
# native-dep-shade.gradle 与 common/build.gradle 的嵌入坐标都从这里读）
zstd_jni_version=1.5.7-7

# Gradle
# daemon=true：多版本锚点编译时复用 JVM；IDE 构建持有 loom 锁时等待其完成。
# 多加载器 + loom remap 时 6G 易在切换 mc_ver 后 daemon 消失；8G 更稳
org.gradle.jvmargs=-Xmx8G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.workers.max=4
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# 依赖下载 HTTP 超时与重试：terraformersmc 等自建 maven 慢/抖（GitHub Actions 上
# 默认 30s 读超时直接失败，如 modmenu 下载 Read timed out）。放大超时 + 提高重试对冲。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.retries=5

# 本地网络若需代理，在本机 ~/.gradle/gradle.properties 配置以下键；CI 默认直连。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
# systemProp.jdk.tls.client.protocols=TLSv1.2
