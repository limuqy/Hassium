# General Properties
java_version=17
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
build_version_suffix=1.20.1

# Fabric-specific Properties
fabric_loader=0.19.3
fabric_api_version=0.92.9+1.20.1

# NeoForge-specific Properties
neoforge_loader=47.1.105
# 1.20.1 的 neoforge 子项目实为 Forge 构建（loom.platform=forge）。
# 默认推导会把 loaderVersion/forge 依赖下限收成 [47.1,)（取 47.1.105 的 major.minor），
# 导致 Forge 47.0.x 用户 pre-loading 报 "needs language provider javafml:47.1 or above"。
# 显式放宽到 [47,)，与 forge 子项目 forge_loader_version_range 及 Forge MDK 模板一致。
neoforge_loader_version_range=[47,)
javafml_loader_version_range=[47,)

# Forge-specific Properties
forge_loader=47.4.21
forge_loader_version_range=[47,)

# Selected loaders (comma-separated: fabric, neoforge, forge)
# Forge 1.20.1 孤岛已撤销：1.20.1 由 neoforge 子项目（loom.platform=forge）承担 Forge 本地兼容，
# 独立 forge 子项目仅维护 1.20.6（段 C 段尾）与 1.21.x。
builds_for=fabric,neoforge,forge


modmenu_version=7.2.2
cloth_config_version=11.1.136

# IMBlocker（仅开发环境 runClient 体验：输入法自动阻断）；modLocalRuntime 引入，不进生产 jar
imblocker_version=5.5.4
